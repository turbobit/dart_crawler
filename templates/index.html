<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV 뷰어</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .file-card {
            transition: transform 0.2s;
            cursor: pointer;
        }
        .file-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .file-icon {
            font-size: 3rem;
            color: #28a745;
        }
        .file-size {
            color: #6c757d;
            font-size: 0.9rem;
        }
        .header-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
    </style>
</head>
<body>
    <div class="header-gradient py-4 mb-4">
        <div class="container">
            <h1 class="text-center mb-0">
                <i class="fas fa-table me-3"></i>CSV 데이터 뷰어
            </h1>
            <p class="text-center mt-2 mb-0">DART 크롤러 데이터를 웹에서 확인하세요</p>
        </div>
    </div>

    <div class="container">
        <div class="row">
            {{range .Files}}
            <div class="col-md-6 col-lg-4 mb-4">
                <div class="card file-card h-100" onclick="viewFile('{{.Name}}')">
                    <div class="card-body text-center">
                        <i class="fas fa-file-csv file-icon mb-3"></i>
                        <h5 class="card-title">{{.Name}}</h5>
                        <p class="file-size">
                            <i class="fas fa-calendar-alt me-1"></i>{{.Modified}}<br>
                            <i class="fas fa-hdd me-1"></i>{{formatFileSize .Size}}
                        </p>
                        <div class="mt-3">
                            <button class="btn btn-primary btn-sm me-2" onclick="event.stopPropagation(); viewFile('{{.Name}}')">
                                <i class="fas fa-eye me-1"></i>보기
                            </button>
                            <button class="btn btn-success btn-sm" onclick="event.stopPropagation(); downloadFile('{{.Name}}')">
                                <i class="fas fa-download me-1"></i>다운로드
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            {{end}}
        </div>
        
        {{if not .Files}}
        <div class="text-center py-5">
            <i class="fas fa-folder-open fa-3x text-muted mb-3"></i>
            <h4 class="text-muted">CSV 파일이 없습니다</h4>
            <p class="text-muted">data 폴더에 CSV 파일을 추가해주세요.</p>
        </div>
        {{end}}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function viewFile(filename) {
            window.location.href = '/view/' + filename;
        }
        
        function downloadFile(filename) {
            const newName = prompt('새로운 파일명을 입력하세요 (확장자 제외):', filename.replace('.csv', ''));
            if (newName) {
                window.location.href = '/download/' + filename + '?newName=' + encodeURIComponent(newName + '.csv');
            }
        }
    </script>
</body>
</html>
